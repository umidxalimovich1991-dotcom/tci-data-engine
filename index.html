<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>FaceControl — Coming Soon</title>
<meta name="description" content="FaceControl.uz — coming soon.">
<style>
:root{--black:#0a0a0a;--white:#f5f5f2;--gray:#8c8c87;--line:#242424}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;display:flex;flex-direction:column}
header{height:88px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:15px;font-weight:800;letter-spacing:.26em}
.logo span{font-weight:400}
.header-right{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
main{flex:1;display:flex;align-items:center}
.hero{width:min(1300px,90vw);margin:auto;padding:60px 0 100px}
.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gray);margin-bottom:30px}
h1{font-size:clamp(70px,14vw,190px);line-height:.78;letter-spacing:-.085em;font-weight:700;margin:0;max-width:1200px}
h1 span{display:block}
.hollow{-webkit-text-stroke:1px #eee;color:transparent}
.subrow{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);margin-top:65px;padding-top:22px;gap:30px}
.statement{font-size:clamp(18px,2vw,27px);line-height:1.25;max-width:540px;letter-spacing:-.02em}
.meta{text-align:right;color:var(--gray);font-size:10px;line-height:1.8;letter-spacing:.15em;text-transform:uppercase}
.bottom{width:min(1300px,90vw);margin:auto;padding:0 0 35px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;color:#666;font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.circle{position:absolute;width:320px;height:320px;border:1px solid #202020;border-radius:50%;right:7vw;top:23vh;pointer-events:none}
.circle:after{content:"";position:absolute;inset:28px;border:1px solid #181818;border-radius:50%}
@media(max-width:700px){
header{height:72px;padding:0 6vw}.header-right{display:none}
.hero{width:88vw;padding:80px 0 70px}.eyebrow{margin-bottom:25px}
h1{font-size:clamp(60px,18vw,115px)}
.subrow{margin-top:55px;display:block}.meta{text-align:left;margin-top:30px}
.circle{width:190px;height:190px;right:-80px;top:28vh;opacity:.5}
.bottom{width:88vw;gap:20px}.bottom span:last-child{text-align:right}
}
</style>
</head>
<body>
<div class="page">
<header>
<a class="logo" href="/">FACE<span>CONTROL</span></a>
<div class="header-right">facecontrol.uz</div>
</header>

<main>
<section class="hero">
<div class="eyebrow">Independent city media / Uzbekistan</div>
<h1><span>FACE</span><span class="hollow">CONTROL</span></h1>

<div class="subrow">
<div class="statement">
Shahar. Odamlar. Joylar.<br>
<strong>Yangi platforma tez orada.</strong>
</div>
<div class="meta">
Launching soon<br>
2026<br>
Bukhara · Uzbekistan
</div>
</div>
</section>
</main>

<div class="bottom">
<span>FC / 001</span>
<span>Coming soon — follow the story</span>
</div>

<div class="circle"></div>
</div>
</body>
</html>
